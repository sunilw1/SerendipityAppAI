# Prometheus configuration for Serendipity AI Backend
# =====================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # API server metrics
  - job_name: 'serendipity-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  # Triton Inference Server metrics
  - job_name: 'triton'
    static_configs:
      - targets: ['triton:8002']
    metrics_path: /metrics

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
